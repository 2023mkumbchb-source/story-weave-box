project_id = "dekyjrfwvavtoivqivno"

[auth]
site_url = "https://www.ompathstudy.com"
additional_redirect_urls = [
  "https://www.ompathstudy.com/auth/callback",
  "https://ompathstudy.com/auth/callback",
  "https://ompathstud-lake.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:5173/auth/callback",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600
