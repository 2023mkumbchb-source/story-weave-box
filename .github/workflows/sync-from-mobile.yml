name: Sync Shared Logic from Ompath mobile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-shared-logic-from-mobile
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout mobile repository
        uses: actions/checkout@v4
        with:
          repository: 2023mkumbchb-source/ompathstudy-mobile
          ref: main
          path: mobile-source
          fetch-depth: 1
      - name: Copy only explicitly shared logic
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const sharedFiles = ["src/lib/academic.ts"];
          for (const file of sharedFiles) {
            if (!file.startsWith("src/lib/")) throw new Error("Refusing to sync non-library path: " + file);
            const source = path.join("mobile-source", file);
            if (!fs.existsSync(source)) throw new Error("Missing mobile source file: " + file);
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.copyFileSync(source, file);
          }
          NODE
      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/lib/academic.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create sync branch and commit
        if: ${{ steps.changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          branch="sync/shared-logic-from-mobile-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/academic.ts
          git commit -m "Sync shared logic from mobile"
          git push --set-upstream origin "$branch"
      - name: Open sync pull request
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head "sync/shared-logic-from-mobile-${GITHUB_RUN_ID}" \
            --title "Sync shared logic from mobile" \
            --body "Automated shared-logic sync. Page layouts, styling, responsive design, components, navigation, website-only code and APK-only code are intentionally excluded."
